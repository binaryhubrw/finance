version: "3.9"

services:
  finance-hb:
    image: ghcr.io/binaryhubrw/finance-hb:latest
    container_name: finance-hb
    ports:
      - "3010:3000"
    # Secrets live only on the server, never in the image.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      UPLOAD_DIR: /data/uploads
    volumes:
      # Receipts are financial records. Without this they live inside the
      # container and are destroyed by the next deploy.
      - finance-uploads:/data/uploads
    restart: unless-stopped

volumes:
  finance-uploads:
